[package]
name = "netease-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
download-core = { path = "../download-core" }
num-bigint = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
urlencoding = "2"
